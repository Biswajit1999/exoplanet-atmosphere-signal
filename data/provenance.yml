project_title: "JWST WASP-39 b CO sub-band reproduction"
repository: "exoplanet-atmosphere-signal"
author: "Biswajit Jana"
data_mode: "real public JWST/NIRSpec G395H products"

source:
  citation: "Grant et al. 2023, ApJL 956, L32"
  article_doi: "10.3847/2041-8213/acfc3b"
  archive_doi: "10.5281/zenodo.7866690"
  record_url: "https://zenodo.org/records/7866690"
  files_committed: 3
  manifest: "data/manifest.csv"

derivation:
  primary_estimand: "mean transit-depth contrast: author-selected CO in-band minus out-of-band samples"
  primary_test: "one-sided Welch unequal-variance t-test"
  uncertainty:
    - "Welch standard error and t-distribution confidence interval"
    - "independent-within-group nonparametric bootstrap"
  robustness:
    - "label permutation (exploratory; exchangeability assumption stated)"
    - "two wavelength-zone contrasts"
    - "leave-one-contiguous-run influence range"
  descriptive_only: "chi-square difference between archived fixed curves; no refitting, AIC, BIC, Bayes factor, or abundance inference"

known_discrepancies:
  - "The archived sub-band file has 111 in-band and 145 out-of-band values; the article text reports 111 and 148. The pipeline uses the released arrays unchanged."

claim_boundary:
  - "This is an independent computational reproduction from the authors' released derived products, not an independent reduction from detector ramps."
  - "The selected bands are model-informed; the test is not a blind search over arbitrary molecules."
  - "Spectral pixels may retain correlation, so the nominal Welch p-value should not be read as a universal detection probability."
